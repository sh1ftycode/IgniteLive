<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ignite · Theme showcase</title>
<style>
/*{{THEMES}}*/
.stage { height: 100%; padding: var(--gap); display: grid; gap: var(--gap); grid-template-columns: 1.15fr 1fr;
  align-items: start; }
.stack { display: grid; gap: var(--gap); }
.song { display: flex; gap: 0.8em; align-items: center; }
.cover { width: 3.4em; height: 3.4em; flex: none; border-radius: calc(var(--radius) / 2);
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.chat { height: auto; padding: 0; justify-content: flex-start; }
.viz { height: 3.2em; padding: 0; }
</style>
</head>
<body>
<!-- Every component in one theme, with sample data: used by the theme gallery. -->
<div class="stage">
  <div class="stack">
    <section class="card" id="playing">
      <div class="song">
        <div class="cover"></div>
        <div style="min-width:0">
          <div class="eyebrow" id="label">Now playing</div>
          <div class="title" id="title"></div>
          <div class="meta" id="meta"></div>
        </div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="times"><span id="pos"></span><span id="dur"></span></div>
    </section>
    <section class="card">
      <div class="eyebrow" id="heading">Up next</div>
      <ul class="rows" id="rows"></ul>
    </section>
    <div class="viz" id="viz"></div>
  </div>
  <div class="chat" id="chat"></div>
</div>
<script>
/*{{COMMON}}*/
const $ = (id) => document.getElementById(id);
ST.on("state", (state) => {
  const current = state.queue.current;
  $("label").textContent = ST.t("overlay.now_playing", "Now playing");
  $("heading").textContent = ST.t("overlay.up_next", "Up next");
  $("title").textContent = current.title;
  $("meta").replaceChildren(current.channel + " · requested by ", ST.el("b", null, current.requested_by));
  $("rows").replaceChildren(...state.queue.upcoming.map((item, i) => {
    const li = ST.el("li");
    li.append(ST.el("span", "num", String(i + 1)), ST.el("span", "song", item.title), ST.el("span", "who", item.requested_by));
    return li;
  }));
});
ST.on("progress", (p) => {
  $("bar").style.width = `${(p.position / p.duration) * 100}%`;
  $("pos").textContent = ST.clock(p.position);
  $("dur").textContent = ST.clock(p.duration);
});
ST.on("chat", (m) => {
  const line = ST.el("div", `line ${m.kind}`);
  const body = ST.el("div");
  const who = ST.el("div", "who-line", m.name);
  const platform = ST.platformBadge(m);
  if (platform) who.prepend(platform, " ");
  (m.badges || []).forEach((b) => who.append(ST.el("span", "badge", b)));
  const value = m.amount ? ` · ${m.amount}` : m.diamonds ? ` · ${m.diamonds} diamonds` : "";
  const text = m.kind === "gift" ? `sent ${m.gift}${m.count !== 1 ? ` ×${m.count}` : ""}${value}`
    : m.kind === "follow" ? ST.t("overlay.chat_follow", "followed", { platform: m.platform_name })
    : m.kind === "join" ? ST.t("overlay.chat_join", "joined", { platform: m.platform_name }) : m.text;
  body.append(who, ST.el("div", "text", text));
  line.append(ST.avatar(m.name, ""), body);
  const chat = $("chat");
  chat.append(line);
  while (chat.children.length > 4) chat.firstElementChild.remove();
});
const bars = Array.from({ length: 24 }, () => $("viz").appendChild(ST.el("i")));
(function frame(now) {
  const t = now / 1000;
  bars.forEach((bar, i) => {
    const h = 0.3 + 0.35 * Math.sin(t * 3 + i * 0.7) * Math.sin(t * 1.3 + i) + 0.3 * Math.max(0, Math.sin(t * 6));
    bar.style.height = `${Math.max(6, Math.abs(h) * 100)}%`;
  });
  requestAnimationFrame(frame);
})(0);
</script>
</body>
</html>
