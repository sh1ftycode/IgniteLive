<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ignite · Commands</title>
<style>
/*{{THEMES}}*/
html, body { height: 100%; overflow: hidden; }
.wrap { height: 100%; padding: var(--gap); }
.card { max-height: 100%; overflow: hidden; display: flex; flex-direction: column; }
.list { flex: 1; min-height: 0; overflow: hidden; position: relative; }
.scroller { display: flex; flex-direction: column; gap: 0.75em; padding-top: 0.6em; }
.scroller.moving { animation: crawl var(--crawl, 30s) linear infinite; }
@keyframes crawl { from { transform: translateY(0); } to { transform: translateY(var(--distance, 0)); } }
@media (prefers-reduced-motion: reduce) { .scroller.moving { animation: none; } }
.group-name { color: var(--muted); font-size: 0.62em; font-weight: 800; letter-spacing: var(--eyebrow-spacing);
  text-transform: uppercase; margin-bottom: 0.2em; }
.cmd { display: grid; grid-template-columns: auto 1fr auto; gap: 0 0.6em; align-items: baseline; padding: 0.15em 0; }
.cmd .name { font-weight: 800; color: var(--accent); white-space: nowrap; }
.cmd .name i { font-style: normal; font-weight: 600; color: var(--muted); }
.cmd .what { font-size: 0.82em; min-width: 0; }
.cmd .what small { color: var(--muted); font-size: 0.85em; }
.cmd .tag { font-size: 0.66em; font-weight: 700; padding: 0 0.45em; border-radius: 4px; white-space: nowrap;
  color: var(--muted); border: 1px solid currentColor; }
.cmd .tag.cost { color: var(--accent-2); }
.empty { color: var(--muted); font-size: 0.8em; margin-top: 0.6em; }
</style>
</head>
<body>
<div class="wrap"><section class="card">
  <div class="eyebrow" id="heading">Commands</div>
  <div class="list" id="list"><div class="scroller" id="scroller"></div></div>
  <div class="empty" id="empty" hidden>No chat commands are on.</div>
</section></div>
<script>
/*{{COMMON}}*/
// Every chat command from Ignite's settings (overlay/command_list.py), grouped; while a game runs, how to play it.
// Options: &mods=1 also lists moderator-only commands. &group=Music (or Points, Moderators, More…) shows one group.
// &aliases=0 hides other names for the same command. A list taller than the overlay scrolls slowly (&speed=40 px/s).
const showMods = ST.params.get("mods") === "1";
const onlyGroup = (ST.params.get("group") || "").toLowerCase();
const showAliases = ST.params.get("aliases") !== "0";
const speed = Math.max(5, Math.min(200, parseInt(ST.params.get("speed") || "30", 10)));
let commands = [], prefix = "!", currency = "points", game = null;
const GAMES = { tug: "Tug-of-war", boss: "Boss fight", poll: "Chat poll" };

function gameRows() {
  if (!game) return [];
  const how = [];
  if (game.kind === "tug") [game.left, game.right].forEach((side) => side && side.how && how.push([side.how, "Join " + side.name]));
  else if (game.kind === "poll" && game.how) how.push([game.how, game.question || "Vote"]);
  else if (game.kind === "boss") how.push(["Send gifts", "Hit the boss"]);
  return how.map(([name, what]) => ({ group: GAMES[game.kind] || "Game", name, aliases: [], usage: "", what, who: "everyone", cost: 0 }));
}

function row(c) {
  const line = ST.el("div", "cmd");
  const name = ST.el("div", "name", c.name);
  if (c.usage) { name.append(" "); name.append(ST.el("i", "", c.usage)); }
  const what = ST.el("div", "what", c.what || "");
  if (showAliases && c.aliases && c.aliases.length) { what.append(" "); what.append(ST.el("small", "", "(also " + c.aliases.join(", ") + ")")); }
  let tag = ST.el("span");
  if (c.cost) tag = ST.el("span", "tag cost", c.cost.toLocaleString() + " " + currency);
  else if (c.who === "mods" && c.group !== "Moderators") tag = ST.el("span", "tag", "mods");
  else if (c.who === "followers") tag = ST.el("span", "tag", "followers");
  line.append(name, what, tag);
  return line;
}

function draw() {
  const list = gameRows().concat(commands).filter((c) =>
    (showMods || c.group !== "Moderators") && (!onlyGroup || c.group.toLowerCase() === onlyGroup));
  const groups = new Map();
  list.forEach((c) => { if (!groups.has(c.group)) groups.set(c.group, []); groups.get(c.group).push(c); });
  const scroller = document.getElementById("scroller");
  scroller.classList.remove("moving");
  scroller.replaceChildren(...[...groups].map(([group, items]) => {
    const box = ST.el("div", "group");
    if (groups.size > 1) box.append(ST.el("div", "group-name", group));
    items.forEach((c) => box.append(row(c)));
    return box;
  }));
  document.getElementById("heading").textContent = ST.t("overlay.commands", "Commands");
  document.getElementById("empty").hidden = list.length > 0;
  // Too tall for the overlay: crawl through the list, then start over (a copy follows so the loop is seamless).
  requestAnimationFrame(() => {
    const box = document.getElementById("list");
    const overflow = scroller.scrollHeight - box.clientHeight;
    if (overflow <= 4) return;
    const height = scroller.scrollHeight;
    [...scroller.children].forEach((child) => scroller.append(child.cloneNode(true)));
    const gap = parseFloat(getComputedStyle(scroller).rowGap) || 0;
    const distance = height + gap;
    scroller.style.setProperty("--distance", `-${distance}px`);
    scroller.style.setProperty("--crawl", `${distance / speed}s`);
    scroller.classList.add("moving");
  });
}

ST.on("commands", (m) => {
  commands = m.commands || [];
  prefix = m.prefix || "!";
  currency = m.currency || "points";
  draw();
});
ST.on("game", (m) => { game = m.game || null; draw(); });
if (ST.demo) {
  commands = [
    { group: "Music", name: "!sr", aliases: ["!play"], usage: "song - artist", what: "Request a song", who: "everyone", cost: 0 },
    { group: "Music", name: "!song", aliases: [], usage: "", what: "What's playing now", who: "everyone", cost: 0 },
    { group: "Music", name: "!skip", aliases: [], usage: "", what: "Skip the song", who: "mods", cost: 0 },
    { group: "Points", name: "!points", aliases: [], usage: "", what: "Your points", who: "everyone", cost: 0 },
    { group: "Points", name: "!bump", aliases: [], usage: "", what: "Move your song to play next", who: "everyone", cost: 500 },
    { group: "More", name: "!hi", aliases: [], usage: "", what: "Say hi on stream", who: "everyone", cost: 0 },
  ];
  draw();
}
</script>
</body>
</html>
