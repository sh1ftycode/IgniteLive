# Builds Ignite for Windows (Setup .exe + zip), Linux (AppImage + tar.gz + Flatpak) and Android (.apk).
# On a tag, it also publishes the GitHub Pages site with the Flatpak repository Ignite's Flatpak updates from.
# Run it from the Actions tab ("Run workflow") to get the files as artifacts, or
# push a tag like v1.2.0 to also publish a GitHub release with all of them.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # The release job, on tag pushes.
  pages: write  # The pages job: the site and the Flatpak repository.
  id-token: write  # (Required by actions/deploy-pages.)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          # The oldest Ubuntu GitHub offers: a Linux build runs on systems as new or newer than where it was built.
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 file

      - name: Install
        run: pip install -e ".[desktop,build]"

      # tests/ is kept private; this runs only in a copy of the repo that has it.
      - name: Test
        if: hashFiles('tests/**/*.py') != ''
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install flatpak-builder
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends flatpak dbus  # dbus: dbus-run-session (Build)
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Flathub's flatpak-builder: Ubuntu's (1.2) runs appstream-compose, which current SDKs no longer have.
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder \
            org.freedesktop.Sdk//26.08 org.freedesktop.Platform//26.08
          echo "FLATPAK_BUILDER=flatpak run org.flatpak.Builder" >> "$GITHUB_ENV"

      # The Flatpak repository's signing key (a secret): Flatpak only installs updates it can verify.
      - name: Flatpak signing key
        if: runner.os == 'Linux'
        env:
          GPG_PRIVATE: ${{ secrets.IGNITE_FLATPAK_GPG_PRIVATE }}
        run: |
          if [ -z "$GPG_PRIVATE" ]; then
            echo "::warning::No IGNITE_FLATPAK_GPG_PRIVATE secret: the Flatpak repository is unsigned and installs can't update."
            exit 0
          fi
          home="$RUNNER_TEMP/flatpak-gnupg"
          mkdir -m 700 "$home"
          printf '%s\n' "$GPG_PRIVATE" | gpg --homedir "$home" --batch --import
          fingerprint=$(gpg --homedir "$home" --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          echo "IGNITE_FLATPAK_GPG_KEY=$fingerprint" >> "$GITHUB_ENV"
          echo "IGNITE_FLATPAK_GPG_HOME=$home" >> "$GITHUB_ENV"

      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"  # Runners have no FUSE to mount AppImages.

      # The main Ignite server's address comes from a repository secret, so it isn't in the source on GitHub.
      - name: Main server
        env:
          IGNITE_MAIN_SERVER: ${{ secrets.IGNITE_MAIN_SERVER }}
        shell: python
        run: |
          import json, os
          url = os.environ.get("IGNITE_MAIN_SERVER", "").strip()
          if url:
              with open("packaging/bundled_config.json", "w", encoding="utf-8") as handle:
                  json.dump({"main_server": url}, handle)
          print("Main server bundled." if url else "No IGNITE_MAIN_SERVER secret: Hosted links need a server set by hand.")

      - name: Build
        if: runner.os != 'Linux'
        run: python packaging/build.py

      # Flathub's flatpak-builder reaches the system's Flatpak over D-Bus: runners have no session bus of their own.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- python packaging/build.py

      # Launch the real app and check its log: catches modules or files that
      # PyInstaller missed, which unit tests can't see.
      - name: Smoke-test the exe
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          IGNITE_CONFIG_DIR: ${{ runner.temp }}\ignite-smoke
        run: |
          $app = Start-Process dist\Ignite\Ignite.exe -PassThru
          Start-Sleep -Seconds 20
          $log = Get-Content "$env:IGNITE_CONFIG_DIR\logs\ignite.log" -Raw
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Write-Output $log
          if ($log -notmatch "WinVaultKeyring") { throw "The exe can't reach Windows Credential Manager." }
          if ($log -notmatch "overlay: degraded") { throw "The overlay server didn't start." }

      - name: Smoke-test the Linux app
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          IGNITE_CONFIG_DIR: ${{ runner.temp }}/ignite-smoke
        run: |
          dist/Ignite/Ignite &
          app=$!
          sleep 20
          kill "$app" 2>/dev/null || true
          log="$IGNITE_CONFIG_DIR/logs/ignite.log"
          cat "$log"
          grep -q "overlay: degraded" "$log" || { echo "The overlay server didn't start."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Ignite-${{ matrix.name }}
          path: |
            dist/Ignite-*.zip
            dist/Ignite-*.tar.gz
            dist/Ignite-*.AppImage
            dist/Ignite-*.flatpak
            dist/Ignite-Setup-*.exe
          if-no-files-found: error

      # The repository installed Flatpaks update from: published on GitHub Pages by the pages job.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: flatpak-repo
          path: dist/flatpak-repo
          if-no-files-found: error

  # Ignite for Android: the web dashboard as an app (android/, packaging/build_apk.py). The runner has the
  # Android SDK. Signed with the release key from the secrets when they're set (create one once with keytool and
  # keep it: phones only update an app signed with the same key), else with a throwaway debug key.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.IGNITE_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ignite.keystore"
            echo "IGNITE_ANDROID_KEYSTORE=$RUNNER_TEMP/ignite.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No IGNITE_ANDROID_KEYSTORE_B64 secret: the APK is signed with a debug key."
          fi

      - name: Build
        env:
          IGNITE_MAIN_SERVER: ${{ secrets.IGNITE_MAIN_SERVER }}
          IGNITE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.IGNITE_ANDROID_KEYSTORE_PASSWORD }}
          IGNITE_ANDROID_KEY_ALIAS: ${{ secrets.IGNITE_ANDROID_KEY_ALIAS }}
        run: python packaging/build_apk.py

      - uses: actions/upload-artifact@v4
        with:
          name: Ignite-android
          path: dist/Ignite-*.apk
          if-no-files-found: error

  # One release with every file, once every build has passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # For CHANGELOG.md.

      - uses: actions/download-artifact@v4
        with:
          pattern: Ignite-*  # The files people download; not the Flatpak repository.
          path: dist
          merge-multiple: true

      # The release page starts with this version's section of CHANGELOG.md ("## 1.6.1" up to the next
      # "## "); GitHub's generated notes (merged PRs, compare link) follow it. Outside dist/: not uploaded.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::CHANGELOG.md has no section for $version; the release only gets GitHub's generated notes."
          fi
          cat "$RUNNER_TEMP/notes.md"

      # Ignite's updater only installs a file whose SHA-256 matches this list.
      - name: Checksums
        run: |
          cd dist
          sha256sum Ignite-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true

  # The GitHub Pages site (the README, as before) plus the Flatpak repository at /flatpak, after the release.
  # Needs Settings → Pages → Source: GitHub Actions.
  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # The Jekyll step leaves _site owned by root: the next steps add to it.
      - name: Own the site folder
        run: sudo chown -R "$USER" _site

      - uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: _site/flatpak

      # One-click install: software centres open .flatpakref files.
      - name: Flatpak install file
        run: |
          cat > _site/flatpak/ignite.flatpakref <<'REF'
          [Flatpak Ref]
          Title=Ignite
          Name=io.github.sh1ftycode.Ignite
          Branch=stable
          Url=https://sh1ftycode.github.io/IgniteLive/flatpak/
          IsRuntime=false
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          REF
          sed -i 's/^ *//' _site/flatpak/ignite.flatpakref
          echo "GPGKey=$(base64 -w0 packaging/flatpak/ignite.gpg)" >> _site/flatpak/ignite.flatpakref
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub sometimes can't find the site it was just given ("No artifacts named github-pages"): try again.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before trying again
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy_again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
