# Re-pushes the Flatpak repository to the main server from a given build, without a new release:
# Actions tab → "Republish Flatpak" → Run workflow. The release build (build.yml) pushes it by itself;
# this is for when that step failed or the server's copy needs redoing.
name: Republish Flatpak

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run to take the Flatpak repository from (empty: the newest release's)"
        required: false

permissions:
  contents: read
  actions: read  # The release build's flatpak-repo artifact.

jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Which build
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch "$tag" --limit 1 \
                       --json databaseId -q '.[0].databaseId')
            echo "Newest release: $tag (build run $RUN_ID)"
          fi
          [ -n "$RUN_ID" ] || { echo "::error::No build run found."; exit 1; }
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: flatpak-repo
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Upload to the server
        env:
          TOKEN: ${{ secrets.FLATPAK_UPLOAD_TOKEN }}
          URL: ${{ vars.FLATPAK_UPLOAD_URL || 'https://ignite.shiftytech.dev/v1/flatpak-upload' }}
        run: |
          tar -cJf flatpak-repo.tar.xz -C flatpak-repo .
          curl -sf --fail-with-body -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            --data-binary @flatpak-repo.tar.xz
