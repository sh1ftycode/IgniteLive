[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ignite-live"
dynamic = ["version"]
description = "One desktop app for TikTok LIVE: stream keys, OBS setup, chat, and chat-driven music."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.7,<7",
    "keyring>=25,<26",
    # Pinned: TikTok's webcast protocol changes often, so upgrade deliberately.
    "TikTokLive==7.0.1",
    # Microsoft Edge voices for text to speech. Unofficial service: upgrade when Microsoft changes it.
    "edge-tts>=7,<8",
]
server = [
    "cryptography>=43",
]
build = [
    "pyinstaller>=6.16,<7",
]

[project.gui-scripts]
# A GUI script: on Windows it starts without a console window (the log is in the Ignite folder instead).
ignite = "ignite_live.app:main"

[project.scripts]
ignite-server = "ignite_live.server.__main__:main"
ignite-streamlabs-login = "ignite_live.cli:streamlabs_login"

[tool.setuptools.dynamic]
version = { attr = "ignite_live.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ignite_live.overlay" = ["static/*"]
